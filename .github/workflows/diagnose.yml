name: Diagnose endpoint access

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner egress IP
        run: curl -s https://api.ipify.org; echo

      - name: Availability endpoint (browser-like headers)
        run: |
          curl -sS -o body.txt -w "HTTP %{http_code}  %{size_download} bytes\n" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Referer: https://www.sevenrooms.com/reservations/lagueritecannes' \
            'https://www.sevenrooms.com/api-yoa/availability/widget/range?venue=lagueritecannes&time_slot=14%3A00&party_size=6&halo_size_interval=100&start_date=09-03-2026&num_days=1&channel=SEVENROOMS_WIDGET' || true
          echo "--- first 600 bytes of body ---"
          head -c 600 body.txt; echo

      - name: Plain booking page
        run: |
          curl -sS -o page.txt -w "HTTP %{http_code}  %{size_download} bytes\n" \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' \
            'https://www.sevenrooms.com/reservations/lagueritecannes' || true
          echo "--- first 300 bytes ---"
          head -c 300 page.txt; echo

      - name: Response headers
        run: |
          curl -sS -D - -o /dev/null \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36' \
            'https://www.sevenrooms.com/api-yoa/availability/widget/range?venue=lagueritecannes&time_slot=14%3A00&party_size=6&halo_size_interval=100&start_date=09-03-2026&num_days=1&channel=SEVENROOMS_WIDGET' \
            | head -40 || true
