name: Diagnose endpoint access

on:
  workflow_dispatch:

jobs:
  browser-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Direct API check (expected to fail from a datacenter IP)
        continue-on-error: true
        env:
          NOTIFY_CHANNELS: console
          DATE: "2026-09-03"
          PARTY_SIZE: "6"
          EARLIEST_TIME: "14:00"
          LATEST_TIME: "16:00"
          STATE_FILE: /tmp/a.json
          LOG_FILE: none
        run: python -m laguerite.monitor --once

      - name: Browser check — drives the real booking form
        env:
          NOTIFY_CHANNELS: console
          DATE: "2026-09-03"
          PARTY_SIZE: "6"
          EARLIEST_TIME: "14:00"
          LATEST_TIME: "16:00"
          STATE_FILE: /tmp/b.json
          LOG_FILE: none
          PLAYWRIGHT_TIMEOUT_MS: "60000"
        run: python -m laguerite.monitor --browser --once

      - name: Browser check against a date that HAS availability
        env:
          NOTIFY_CHANNELS: console
          DATE: "2026-09-08"
          PARTY_SIZE: "6"
          EARLIEST_TIME: "14:00"
          LATEST_TIME: "16:00"
          STATE_FILE: /tmp/c.json
          LOG_FILE: none
          PLAYWRIGHT_TIMEOUT_MS: "60000"
        run: python -m laguerite.monitor --browser --once
